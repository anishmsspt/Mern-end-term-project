name: Bootstrap Production Host

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Create production host
        working-directory: server
        env:
          NODE_ENV: production
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BOOTSTRAP_HOST_EMAIL: ${{ secrets.BOOTSTRAP_HOST_EMAIL }}
          BOOTSTRAP_HOST_PASSWORD: ${{ secrets.BOOTSTRAP_HOST_PASSWORD }}
          BOOTSTRAP_HOST_NAME: ${{ secrets.BOOTSTRAP_HOST_NAME }}
        run: npm run bootstrap:host
