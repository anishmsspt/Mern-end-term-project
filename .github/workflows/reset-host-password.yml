name: Reset Production Host Password

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Reset host password
        working-directory: server
        env:
          NODE_ENV: production
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          HOST_PASSWORD: ${{ secrets.BOOTSTRAP_HOST_PASSWORD }}
        run: |
          node -e '
          const mongoose = require("mongoose");
          const bcrypt = require("bcryptjs");
          const User = require("./src/models/User");

          (async () => {
            await mongoose.connect(process.env.MONGODB_URI);
            const user = await User.findOne({ email: "host@unanimous.dev" });
            if (!user || user.role !== "host") {
              throw new Error("Existing host account not found");
            }
            user.passwordHash = await bcrypt.hash(process.env.HOST_PASSWORD, 10);
            await user.save();
            console.log("Host password updated successfully.");
            await mongoose.disconnect();
          })().catch(async error => {
            console.error(error.message);
            await mongoose.disconnect();
            process.exit(1);
          });
          '
